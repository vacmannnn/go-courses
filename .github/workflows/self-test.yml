name: Test the grader
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: autotests/go.mod
          cache: false
      - run: python3 -m pip install -r autotests/requirements.txt
      - run: make check
        working-directory: autotests
      - run: make test
        working-directory: autotests

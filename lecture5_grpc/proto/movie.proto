syntax = "proto3";

package movies.v1;
option go_package = "example.com/grpcdemo/gen/moviesv1";

message GetMovieRequest {
  int64 id = 1;
}

message Movie {
  int64 id = 1;
  string title = 2;
  int32 year = 3;
}

message LoadMoviesRequest {
  int64 from = 1;
  int64 to = 2;
}

message LoadProgress {
  int64 movie_id = 1;
  int32 loaded = 2;
}

service MovieService {
  rpc GetMovie(GetMovieRequest) returns (Movie);
  rpc LoadMoviesStream(LoadMoviesRequest) returns (stream LoadProgress);
}
